name: Fix pity caps
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix pity caps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='pity:{epic:epicDone?0:Math.min(100,p.pity.epic+1),legendary:legendaryDone?0:Math.min(100,p.pity.legendary+1),mythic:mythicDone?0:Math.min(100,p.pity.mythic+1)},'
          new='pity:{epic:epicDone?0:Math.min(100,p.pity.epic+1),legendary:legendaryDone?0:Math.min(250,p.pity.legendary+1),mythic:mythicDone?0:Math.min(500,p.pity.mythic+1)},'
          if old not in s:
              raise SystemExit('pity line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git rm .github/workflows/fix-pity-caps.yml
          git commit -m 'fix: allow legendary and mythic pity to reach their caps'
          git push
